<!DOCTYPE html>
<html>

<head>
    <title>{{ .Site.Title }} - {{ .Title }}</title>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="language" content="de" />
    <link rel="icon" href="/img/favicon.png" type="image/png">
    <link rel="Shortcut Icon" href="/img/favicon.png" type="image/png">
    {{ $style := resources.Get "css/style.css" | resources.Minify | resources.Fingerprint }}
    <link type="text/css" rel="stylesheet" href="{{ $style.RelPermalink }}" media="all">

    <script src='https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.js'></script>
    <link href='https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css' rel='stylesheet' />

    <script type="text/javascript" src="./js/map.js"></script>

    <link rel="stylesheet" href="./style.css" type="text/css" media="all" />
</head>

<body>
    <header>
        <a id="osm-logo-karte" href="/" title="OpenStreetMap - Deutschland" rel="home"><img src="/img/logos/osmde.svg"
                alt="OpenStreetMap Deutschland" /></a>
        {{- partial "menu.html" . -}}
    </header>

    <div id="map">
    </div>

    <div id='map'></div>
    <div class="controls" style="position:absolute;top:10px;left:10px;z-index:1;background:white;padding:5px;">
        <div class="layer-control">
            <label><input type="radio" name="baselayer" value="vector" checked> Vector (Tilekiln)</label><br>
            <label><input type="radio" name="baselayer" value="osm"> OpenStreetMap</label><br>
            <label><input type="radio" name="baselayer" value="opentopo"> OpenTopoMap</label>
        </div>
        <div>
            <input type="text" id="search" placeholder="Ort suchen..." />
            <button id="search-btn">Suchen</button>
        </div>
    </div>

    <script>
        var map = new maplibregl.Map({
            container: 'map',
            style: "https://pnorman.github.io/tilekiln-shortbread-demo/colorful.json",
            center: [7, 50],
            zoom: 5
        });

        map.addControl(new maplibregl.NavigationControl(), 'top-right');
        map.addControl(new maplibregl.GeolocateControl({
            positionOptions: {
                enableHighAccuracy: true
            },
            trackUserLocation: true,
            showAccuracyCircle: false
        }), 'top-right');

        map.addControl(new maplibregl.FullscreenControl(), 'top-right');

        map.addControl(new maplibregl.ScaleControl(), 'bottom-left');



        /* Maplink 1 */

        map.on('moveend', () => {
            const center = map.getCenter();
            const zoom = map.getZoom().toFixed(2);
            const lat = center.lat.toFixed(5);
            const lng = center.lng.toFixed(5);
            window.location.hash = `${zoom}/${lat}/${lng}`;
        });

        // Beim Laden den Hash auslesen und Karte setzen
        function setMapFromHash() {
            const hash = window.location.hash.replace('#', '');
            const parts = hash.split('/');
            if (parts.length === 3) {
                const z = parseFloat(parts[0]);
                const lat = parseFloat(parts[1]);
                const lng = parseFloat(parts[2]);
                if (!isNaN(z) && !isNaN(lat) && !isNaN(lng)) {
                    map.jumpTo({ center: [lng, lat], zoom: z });
                }
            }
        }

        map.on('load', setMapFromHash);

        /* Maplink 2 */







        /* Layer 1*/
        map.on('load', () => {
            function addRasterLayers() {
                if (!map.getSource('osm')) {
                    map.addSource('osm', {
                        type: 'raster',
                        tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
                        tileSize: 256,
                        attribution: '© OpenStreetMap contributors'
                    });

                    map.addLayer({
                        id: 'osm-layer',
                        type: 'raster',
                        source: 'osm',
                        layout: { visibility: 'none' }
                    });
                }

                if (!map.getSource('opentopo')) {
                    map.addSource('opentopo', {
                        type: 'raster',
                        tiles: ['https://tile.opentopomap.org/{z}/{x}/{y}.png'],
                        tileSize: 256,
                        attribution: '© OpenTopoMap'
                    });

                    map.addLayer({
                        id: 'opentopo-layer',
                        type: 'raster',
                        source: 'opentopo',
                        layout: { visibility: 'none' }
                    });
                }
            }

            addRasterLayers(); // Initial hinzufügen

            document.querySelectorAll('input[name="baselayer"]').forEach((input) => {
                input.addEventListener('change', (e) => {
                    const selected = e.target.value;

                    if (selected === 'vector') {
                        map.setStyle("https://pnorman.github.io/tilekiln-shortbread-demo/colorful.json");

                        // Wenn der neue Style geladen ist, Rasterlayer neu hinzufügen
                        map.once('style.load', () => {
                            addRasterLayers();
                        });
                    } else {
                        // Falls der Style keine Layer enthält (z.B. nach Vector-Style-Wechsel), auch prüfen
                        const hasOSM = map.getLayer('osm-layer');
                        const hasOpenTopo = map.getLayer('opentopo-layer');

                        if (!hasOSM || !hasOpenTopo) {
                            addRasterLayers();
                        }

                        map.setLayoutProperty('osm-layer', 'visibility', selected === 'osm' ? 'visible' : 'none');
                        map.setLayoutProperty('opentopo-layer', 'visibility', selected === 'opentopo' ? 'visible' : 'none');
                    }
                });
            });
        });
        /* Layer 2*/












        /* geocode 1*/
        document.getElementById('search-btn').addEventListener('click', () => {
            const query = document.getElementById('search').value;

            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`)
                .then(response => response.json())
                .then(data => {
                    if (data.length > 0) {
                        const place = data[0];
                        const lng = parseFloat(place.lon);
                        const lat = parseFloat(place.lat);

                        map.flyTo({ center: [lng, lat], zoom: 14 });

                        new maplibregl.Marker()
                            .setLngLat([lng, lat])
                            .addTo(map);
                    } else {
                        alert('Ort nicht gefunden');
                    }
                });
        });
        /* geocode 2*/















        // KML-Datei vom Webserver laden
        fetch('/osm_user_groups_DACH.kml')  // KML-Datei vom Server holen
            .then(response => response.text())  // Die KML-Datei als Text bekommen
            .then(kmlText => {
                var parser = new DOMParser();
                var xmlDoc = parser.parseFromString(kmlText, 'application/xml');  // KML in XML umwandeln

                // Alle <placemark>-Elemente extrahieren
                var placemarks = xmlDoc.getElementsByTagName('Placemark');

                // GeoJSON-Daten erstellen
                var geojson = {
                    type: 'FeatureCollection',
                    features: []
                };

                // Durch alle Placemark-Elemente iterieren und die Koordinaten extrahieren
                for (var i = 0; i < placemarks.length; i++) {
                    var placemark = placemarks[i];
                    var name = placemark.getElementsByTagName('name')[0]?.textContent || 'Unbenannt';
                    var when = placemark.getElementsByTagName('when')[0]?.textContent || '?';
                    var wiki = placemark.getElementsByTagName('wiki')[0]?.textContent || '?';
                    var url = placemark.getElementsByTagName('url')[0]?.textContent || '?';
                    var mail = placemark.getElementsByTagName('mail')[0]?.textContent || '?';
                    var where = placemark.getElementsByTagName('where')[0]?.textContent || '?';
                    var photo = placemark.getElementsByTagName('photo')[0]?.textContent || './img/nophoto.png';
                    var coordinatesText = placemark.getElementsByTagName('coordinates')[0]?.textContent.trim();

                    // Koordinaten extrahieren (KML-Koordinaten sind normalerweise in lon,lat,alt Reihenfolge)
                    if (coordinatesText) {
                        var coordinates = coordinatesText.split(' ').map(coord => {
                            var [lon, lat] = coord.split(',').map(parseFloat);
                            return [lon, lat];  // Hier wird nur lon und lat gespeichert
                        });

                        // Feature für GeoJSON erstellen
                        geojson.features.push({
                            type: 'Feature',
                            geometry: {
                                type: 'Point',
                                coordinates: coordinates[0]  // Nur der erste Punkt wird verwendet
                            },
                            properties: {
                                name: name,
                                when: when,
                                wiki: wiki,
                                url: url,
                                mail: mail,
                                where: where,
                                photo: photo
                            }
                        });
                    }
                }

                // Karte laden, wenn sie bereit ist
                map.on('load', function () {
                    // GeoJSON-Daten als Quelle hinzufügen
                    map.addSource('kml-data', {
                        type: 'geojson',
                        data: geojson  // GeoJSON-Daten
                    });

                    // Marker für alle Features im GeoJSON hinzufügen
                    map.addLayer({
                        id: 'kml-markers',
                        type: 'circle',
                        source: 'kml-data',
                        paint: {
                            'circle-radius': 6,
                            'circle-color': '#FF5722'
                        }
                    });

                    // Optional: Popups hinzufügen
                    map.on('click', 'kml-markers', function (e) {
                        const properties = e.features[0].properties;
                        const coordinates = e.features[0].geometry.coordinates;

                        const name = properties.name;
                        const photo = properties.photo;
                        const when = properties.when;
                        const where = properties.where;
                        const wiki = properties.wiki;
                        const url = properties.url;
                        const mail = properties.mail;

                        const popupHTML = `
                            <section aria-label="Ortsinformationen">
                                <header>
                                    <div><p><bigger>${name}</bigger></p><div>
                                </header>
                                <div>
                                    <img src="${photo}" style="width: 100%;height: auto;" alt="Foto von ${name}"/>
                                    <div>
                                      <b>Wann:</b> ${when} 
                                      <br> 
                                      <b>Wo:</b> ${where}
                                    </div>
                                </div>
                                <hr>
                                <address>
                                    ${wiki ? `<a href="${wiki}" target="_blank" rel="noopener" aria-label="Wikipedia-Seite zu ${name}">Wikipedia</a><br>` : ''}
                                    ${url ? `<a href="${url}" target="_blank" rel="noopener" aria-label="Website von ${name}">Website</a><br>` : ''}
                                    ${mail ? `<a href="mailto:${mail}" aria-label="E-Mail an ${name}">Mail schreiben</a>` : ''}
                                </address>
                            </section>
                        `;

                        new maplibregl.Popup()
                            .setLngLat(coordinates)
                            .setHTML(popupHTML)
                            .addTo(map);
                    });
                });
            })
            .catch(err => console.error('Fehler beim Laden der KML-Datei:', err));

    </script>

    {{ $script := resources.Get "js/script.js" }}
    <script src="{{ $script.RelPermalink }}"></script>

</body>

</html>
